<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>SIGMA-TECH</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 8%,rgba(255,193,7,.13),transparent 27%),
    linear-gradient(145deg,#030303 0%,#0b0903 48%,#020202 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:20;
  background:repeating-linear-gradient(0deg,rgba(255,193,7,.018) 0 1px,transparent 1px 5px);
  opacity:.55;
}
.page{
  width:min(100%,520px);
  min-height:100vh;min-height:100svh;
  margin:auto;
  padding:30px 18px 24px;
  display:flex;flex-direction:column;align-items:center;
}
.title{
  margin:0 0 30px;
  color:#ffd21a;
  font-size:clamp(31px,9vw,52px);
  line-height:1;
  letter-spacing:4px;font-weight:950;text-align:center;
  text-shadow:0 0 8px #ffb30080,0 0 28px #ffb30035;
  user-select:none;
}
.title-wrap{position:relative;display:inline-block}
.title-wrap:after{
  content:"";position:absolute;left:-8px;right:-8px;bottom:-10px;height:2px;
  background:linear-gradient(90deg,transparent,#fff000,#ff7b00,transparent);
  box-shadow:0 0 12px #ffd000;
  animation:scanTitle 2.2s linear infinite;
}
@keyframes scanTitle{0%{transform:translateX(-8px);opacity:.3}50%{opacity:1}100%{transform:translateX(8px);opacity:.3}}

.servers{width:100%;display:flex;flex-direction:column;gap:16px}
.server{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:21px 21px;
  min-height:125px;
  border:1px solid #ffbd005e;border-radius:25px;
  background:linear-gradient(135deg,rgba(29,24,8,.98),rgba(8,8,7,.98));
  text-decoration:none;color:#fff;
  box-shadow:0 10px 30px #000b,inset 0 0 30px #ffb30008;
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.server:before{
  content:"";position:absolute;left:-25%;top:0;width:22%;height:100%;
  background:linear-gradient(90deg,transparent,#fff36a,#ffc400,transparent);
  filter:blur(5px);opacity:.85;
  animation:scan 2.7s linear infinite;
  pointer-events:none;
}
.server:nth-child(2):before{animation-delay:1.35s}
.server:after{
  content:"";position:absolute;inset:0;border-radius:25px;
  border:1px solid transparent;
  background:linear-gradient(120deg,#ffd40055,#ff6a0050,#fff00055,#ffd40055) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  background-size:250% 250%;
  animation:borderFlow 4s linear infinite;
  pointer-events:none;
}
@keyframes scan{0%{left:-28%;opacity:0}12%{opacity:1}55%{opacity:.9}100%{left:110%;opacity:0}}
@keyframes borderFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.server:active{transform:scale(.975)}
.server:hover{border-color:#ffd000;box-shadow:0 0 24px #ffb30022,0 12px 34px #000}
.left{display:flex;align-items:center;gap:15px;min-width:0;position:relative;z-index:1}
.bubble{
  width:49px;height:49px;flex:0 0 49px;border-radius:50%;
  background:radial-gradient(circle at 32% 27%,#fff5a1 0,#ffd11a 28%,#ff9700 58%,#9b4a00 100%);
  box-shadow:0 0 17px #ffc40066,0 0 34px #ff8c0025;
  animation:pulse 2s ease-in-out infinite;
}
.server:nth-child(2) .bubble{animation-delay:1s}
@keyframes pulse{50%{box-shadow:0 0 24px #ffe00088,0 0 45px #ff8c0035;transform:scale(1.035)}}
.name{font-size:18px;font-weight:900;letter-spacing:.7px}
.url{margin-top:5px;color:#aaa;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.status{font-size:11px;margin-top:7px;font-weight:900;letter-spacing:.5px}
.online{color:#ffd21a;text-shadow:0 0 8px #ffb30055}
.offline{color:#777}
.arrow{position:relative;z-index:1;font-size:29px;color:#ffd21a;font-weight:900;text-shadow:0 0 10px #ffb30055}
.footer{
  margin-top:22px;
  padding:12px 18px;
  border-top:1px solid #ffcf1740;
  color:#ffd21a;font-size:12px;font-weight:900;letter-spacing:2px;text-align:center;
  text-shadow:0 0 10px #ffb30055;
}
@media(max-width:380px){
  .page{padding:26px 14px 20px}
  .title{margin-bottom:27px}
  .server{padding:19px 17px;min-height:118px}
  .url{max-width:205px}
}
</style>
</head>
<body>
<main class="page">
  <div class="title-wrap"><h1 class="title">SIGMA-TECH</h1></div>

  <section class="servers" aria-label="Servers">
    <a class="server" href="https://sigma-md.up.railway.app" target="_blank" rel="noopener noreferrer">
      <div class="left">
        <span class="bubble"></span>
        <div>
          <div class="name">SERVER 1</div>
          <div class="url">sigma-md.up.railway.app</div>
          <div class="status online">● ONLINE</div>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="server" href="https://sigma-md2.up.railway.app" target="_blank" rel="noopener noreferrer">
      <div class="left">
        <span class="bubble"></span>
        <div>
          <div class="name">SERVER 2</div>
          <div class="url">sigma-md2.up.railway.app</div>
          <div class="status online">● ONLINE</div>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>
  </section>

  <footer class="footer">CREATED: SIGMA-MD</footer>
</main>
</body>
</html>
